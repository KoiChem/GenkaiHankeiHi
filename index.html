<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <link rel="icon" href="data:,">
    <title>FCC・間隙 — 限界半径比いじくるくん</title>
    <style>
        :root {
            --bg-color: #f8f9fa;
            --panel-bg: rgba(255, 255, 255, 0.92);
            --primary: #007aff;
            --danger: #ff3b30;
            --success: #34c759;
            --warning: #ff9500;
            --btn-height: 34px;
        }

        html, body {
            margin: 0; padding: 0; overflow: hidden;
            font-family: -apple-system, sans-serif;
            background-color: var(--bg-color);
            touch-action: none;
            overscroll-behavior: none;
        }

        #ui-panel {
            position: absolute; width: 300px;
            background: var(--panel-bg); backdrop-filter: blur(15px);
            padding: 18px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            z-index: 100; border: 1px solid rgba(0,0,0,0.08);
            transition: transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 0.3s;
            max-height: 85vh; overflow-y: auto;
            overscroll-behavior: contain; touch-action: pan-y;
        }

        @media (min-width: 600px) {
            #ui-panel { top: 70px; right: 15px; }
            #ui-panel.hidden { transform: translateX(350px); opacity: 0; pointer-events: none; }
        }
        @media (max-width: 599px) {
            #ui-panel { bottom: 20px; left: 50%; transform: translateX(-50%); width: 85%; }
            #ui-panel.hidden { transform: translate(-50%, 120%); opacity: 0; pointer-events: none; }
        }

        #toggle-panel-btn {
            position: absolute; top: 15px; right: 15px; z-index: 110;
            padding: 10px 18px; border-radius: 50px; border: none;
            background: var(--primary); color: white; font-weight: bold;
            cursor: pointer; box-shadow: 0 4px 12px rgba(0,122,255,0.3);
            display: flex; align-items: center; gap: 6px; font-size: 0.9rem;
            transition: background 0.3s, transform 0.2s;
        }
        #toggle-panel-btn:active { transform: scale(0.95); }

        .label-text { display: flex; justify-content: space-between; font-size: 0.8rem; font-weight: 600; margin-bottom: 2px; color: #555; align-items: center; }

        .btn-group { display: flex; gap: 8px; margin-bottom: 12px; height: var(--btn-height); }
        .btn-group button { flex: 1; border: none; border-radius: 8px; background: rgba(0,0,0,0.05); cursor: pointer; font-size: 0.75rem; font-weight: bold; transition: 0.2s; height: 100%; display: flex; align-items: center; justify-content: center; padding: 0; box-sizing: border-box; }
        .type-btns button.active, .bg-btns button.active { background: var(--primary) !important; color: white !important; border-color: transparent !important; }

        .toggle-btn { height: var(--btn-height); border-radius: 8px; border: 1.5px solid var(--primary); background: transparent; color: var(--primary); font-weight: bold; cursor: pointer; font-size: 0.75rem; transition: 0.2s; box-sizing: border-box; display: flex; align-items: center; justify-content: center; padding: 0; width: 100%; }
        .toggle-btn.active { background: var(--primary); color: white; }
        .toggle-btn.disabled { opacity: 0.3; pointer-events: none; filter: grayscale(1); }

        .mini-btn-group { display: flex; gap: 4px; height: var(--btn-height); box-sizing: border-box; }
        .mini-btn-group button { flex: 1; border: 1.5px solid var(--primary); background: transparent; color: var(--primary); border-radius: 6px; cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0; transition: 0.2s; }
        .mini-btn-group button.active { background: var(--primary); color: white; }

        input[type="range"] { -webkit-appearance: none; width: 100%; background: transparent; height: 36px; margin: 0; cursor: pointer; touch-action: auto; transition: 0.3s; }
        input[type="range"]::-webkit-slider-runnable-track { width: 100%; height: 6px; background: #d1d1d6; border-radius: 3px; }
        input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; height: 26px; width: 26px; border-radius: 50%; background: var(--primary); margin-top: -10px; box-shadow: 0 2px 6px rgba(0,0,0,0.25); }
        input[type="range"]:disabled::-webkit-slider-thumb { background: #999; box-shadow: none; }

        #stability-info { font-size: 0.7rem; white-space: nowrap; font-weight: bold; }
        #toggle-ratio-pin { width: 32px; height: 32px; border-radius: 3px; font-size: 1.2rem; display: flex; align-items: center; justify-content: center; flex-shrink: 0; padding: 0; }
        .stable { color: var(--success); }
        .unstable { color: var(--danger); }
        .opacity-row { display: flex; align-items: center; margin-bottom: 2px; transition: opacity 0.3s; }

        .opacity-label { font-size: 0.8rem; font-weight: 600; width: 65px; white-space: nowrap; }

        .cam-btn-container { flex: 1; display: flex; background: rgba(0,0,0,0.05); border-radius: 8px; padding: 2px; box-sizing: border-box; height: 100%; }
        .cam-btn { flex: 1; height: 100%; border: none; background: transparent; border-radius: 6px; cursor: pointer; display: flex; align-items: center; justify-content: center; color: #888; transition: all 0.3s cubic-bezier(0.2, 0.8, 0.2, 1); padding: 0; margin: 0; }
        .cam-btn.active { background: var(--primary); color: white; box-shadow: 0 2px 6px rgba(0,122,255,0.3); }

        .control-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 8px; margin-bottom: 12px; }
        [hidden] { display: none !important; }
        .cam-btn-container { gap: 4px; }
        #fcc-controls .label-text { margin-bottom: 5px; }
        #fcc-controls .btn-group { height: 34px; }
        #fcc-controls button.active { background: var(--primary); color: white; }
        #fcc-controls .opacity-label { width: 92px; }
        #fcc-grid-row { grid-template-columns: 1fr 1fr; align-items: center; }
        #fcc-grid-row .mini-btn-group { width: 100%; }
        #fcc-controls.comparing #fcc-grid-row { grid-template-columns: 1fr; }
        #fcc-controls.comparing #fcc-void-controls { border-top: 1px solid rgba(0,0,0,.12); padding-top: 12px; margin-top: 4px; }
        #fcc-void-controls { margin-bottom: 12px; }
        #fcc-portrait { position: fixed; bottom: max(12px, env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%); z-index: 4; padding: 5px 12px; border-radius: 12px; background: rgba(255,255,255,.86); color: #333; font-size: 12px; pointer-events: none; }
        #fcc-divider { position: fixed; left: 50%; top: 0; bottom: 0; border-left: 1px solid rgba(128,128,128,.45); pointer-events: none; z-index: 2; }
        #fcc-loading { position: fixed; left: 16px; bottom: 16px; z-index: 5; color: #555; font-size: 12px; background: rgba(255,255,255,.9); padding: 6px 10px; border-radius: 8px; }
        @media (max-height: 540px) { #ui-panel { top: 66px; bottom: auto; max-height: calc(100dvh - 100px); padding: 12px; width: 290px; left: auto; right: 12px; transform: none; } #ui-panel.hidden { transform: translateX(350px); } }

        :root { --primary:#245b8c; --panel-bg:#f8fbff; --btn-height:40px; }
        #ui-panel { width:310px; padding:12px; box-sizing:border-box; border:1px solid #8094a8; max-height:calc(100dvh - 90px); color:#20364b; background:#f8fbff; }
        .label-text { color:#43566a; font-size:12px; line-height:1.4; margin-bottom:6px; }
        #ui-panel .btn-group { height:auto; min-height:40px; gap:8px; margin-bottom:10px; }
        #ui-panel button { height:40px; min-height:40px; padding:6px 4px; color:#254560; background:#fff; border:1px solid #6b8198; border-radius:8px; font-size:13px; line-height:1.3; font-weight:600; box-shadow:none; transition:background-color .15s; }
        #ui-panel button:hover:not(:disabled) { background:#edf4fb; border-color:#245b8c; }
        #ui-panel button.active,#ui-panel .type-btns button.active,#ui-panel .bg-btns button.active { color:#173b61 !important; background:#dceafb !important; border-color:#406b96 !important; box-shadow:inset 0 0 0 1px #406b96; font-weight:700; }
        #ui-panel button:disabled,#ui-panel button.disabled { color:#5a6875 !important; background:#edf1f5 !important; border-color:#a9b4bf !important; box-shadow:none; opacity:1; filter:none; cursor:default; pointer-events:auto; }
        #ui-panel .type-btns button { background:#edf5fc; border:2px solid #64829c; font-weight:700; }
        #ui-panel button:focus-visible,#ui-panel input:focus-visible,#toggle-panel-btn:focus-visible { outline:2px solid #151515; outline-offset:3px; box-shadow:0 0 0 3px #ffe18a; }
        #toggle-panel-btn { min-height:44px; background:#245b8c; box-shadow:0 3px 8px #173b6126; }
        .cam-btn-container { width:100%; gap:8px; height:auto; padding:0; background:transparent; align-items:center; margin-bottom:10px; }
        #ui-panel .cam-btn { flex-direction:column; gap:3px; font-size:12px; }
        #ui-panel .cam-btn svg { width:18px; height:18px; }
        .stereo-control { display:flex; gap:6px; padding:4px; border:1px solid #8094a8; border-radius:9px; background:#edf4fb; flex:1; min-width:0; }
        #ui-panel #btn-stereo { flex:1; min-width:56px; }
        #ui-panel #btn-stereo { border:0 !important; box-shadow:none !important; background:transparent !important; }
        .stereo-control.active { background:#dceafb; border-color:#406b96; }
        #ui-panel #btn-stereo-strong { flex:0 0 40px; padding:4px; }
        #ui-panel #btn-persp,#ui-panel #btn-ortho { flex:0 0 66px; }
        .context-reason { display:none !important; }
        .full-row { grid-column:1/-1; margin:0; }
        #fcc-controls .btn-group { height:auto; }
        #fcc-grid-row { grid-template-columns:minmax(132px,1.2fr) minmax(0,1fr); gap:8px; }
        .mini-btn-group { gap:6px; height:auto; min-height:40px; }
        #ui-panel .mini-btn-group button { flex-direction:column; gap:1px; padding:4px; font-size:11px; min-width:40px; }
        #ui-panel .mini-btn-group svg { width:20px; height:20px; }
        #ui-panel .mini-btn-group button[data-mode="1"],#ui-panel .mini-btn-group button[data-mode="2"] { padding:3px; }
        #ui-panel .mini-btn-group button[data-mode="1"] svg,#ui-panel .mini-btn-group button[data-mode="2"] svg { width:32px; height:32px; }
        #ui-panel #toggle-ratio-pin { width:58px; height:40px; flex-shrink:0; font-size:12px; }
        #ui-panel .toggle-btn { height:40px; }
        .control-grid { gap:8px; }
        #common-actions { grid-template-columns:1fr 1fr; }
        .opacity-row { min-height:44px; gap:8px; margin-bottom:0; }
        #ui-panel .opacity-label,#fcc-controls .opacity-label { color:#20364b; width:100px; font-size:12px; flex-shrink:0; }
        #ui-panel input[type=range] { min-width:0; height:44px; accent-color:#245b8c; }
        #ui-panel input[type=range]::-webkit-slider-runnable-track { background:#70849a; }
        #ui-panel input[type=range]::-webkit-slider-thumb { background:#245b8c; border:2px solid #fff; box-shadow:0 0 0 1px #245b8c; }
        #ui-panel #legacy-opacity .opacity-label { width:60px; }
        #ui-panel #opacity-p-slider::-webkit-slider-thumb { background:#ffb6c1; box-shadow:0 0 0 1px #875762; }
        #ui-panel #opacity-m-slider::-webkit-slider-thumb { background:#add8e6; box-shadow:0 0 0 1px #416d7b; }
        #ui-panel #opacity-p-slider::-moz-range-thumb { background:#ffb6c1; border:2px solid #fff; box-shadow:0 0 0 1px #875762; }
        #ui-panel #opacity-m-slider::-moz-range-thumb { background:#add8e6; border:2px solid #fff; box-shadow:0 0 0 1px #416d7b; }
        #ui-panel #legacy-opacity input:disabled::-webkit-slider-thumb { background:#a9b4bf; box-shadow:0 0 0 1px #6b8198; }
        #ui-panel #legacy-opacity input:disabled::-moz-range-thumb { background:#a9b4bf; box-shadow:0 0 0 1px #6b8198; }
        #ui-panel .stable { color:#26643d; } #ui-panel .unstable { color:#9f2424; }
        #ui-panel .bg-btns button { background:#fff !important; color:#254560 !important; border:1px solid #6b8198 !important; }
        #ui-panel .bg-btns button::before { content:''; width:12px; height:12px; border:1px solid #526b81; border-radius:3px; margin-right:5px; }
        #ui-panel .bg-btns button[data-color=white]::before { background:#fff; }
        #ui-panel .bg-btns button[data-color=gray]::before { background:#888; }
        #ui-panel .bg-btns button[data-color=black]::before { background:#222; }
        #ui-panel .bg-btns button.active { background:#dceafb !important; color:#173b61 !important; border-color:#406b96 !important; }
        @media(max-width:599px) { #ui-panel { width:calc(100% - 24px); max-width:310px; max-height:72dvh; bottom:12px; padding:12px; } }
        @media(max-height:540px) { #ui-panel { width:310px; max-width:calc(100% - 24px); top:66px; right:12px; left:auto; bottom:auto; max-height:calc(100dvh - 82px); padding:12px; } }
        @media(max-width:319px) { .cam-btn-container { flex-wrap:wrap; } .stereo-control { flex-basis:100%; } }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/TrackballControls.js"></script>
    <script src="fcc-geometry.js"></script>
    <script src="fcc-view.js?v=20261103-compact-panel"></script>
    <script src="model-views.js?v=20261102-panel"></script>
    <script src="view-cube.js?v=20261103-view-controls"></script>
</head>
<body>

<button id="toggle-panel-btn">✕ 設定を閉じる</button>

<div id="ui-panel">
    <div class="btn-group" id="panel-utilities">
        <button id="toggle-pin" class="toggle-btn active" style="border-width: 1.5px;">パネル固定</button>
        <button id="toggle-fullscreen" class="toggle-btn">全画面</button>

    </div>

    <section class="view-section" aria-label="視点・立体視">
        <div class="cam-btn-container">
            <button id="btn-persp" class="cam-btn active" title="透視投影 (パースあり)" aria-label="透視投影">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="5" width="18" height="14" rx="1"></rect>
                    <rect x="8" y="9" width="8" height="6" rx="1"></rect>
                    <line x1="3" y1="5" x2="8" y2="9"></line>
                    <line x1="21" y1="5" x2="16" y2="9"></line>
                    <line x1="3" y1="19" x2="8" y2="15"></line>
                    <line x1="21" y1="19" x2="16" y2="15"></line>
                </svg>
            </button>
            <button id="btn-ortho" class="cam-btn" title="平行投影 (パースなし)" aria-label="平行投影">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>
                    <polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline>
                    <line x1="12" y1="22.08" x2="12" y2="12"></line>
                </svg>
            </button>
            <div class="stereo-control" role="group" aria-label="立体視">
            <button id="btn-stereo" class="cam-btn" title="立体視：通常表示" aria-label="立体視：通常表示" >立体視</button>
                <button id="btn-stereo-strong" class="cam-btn" aria-label="立体視を強くする" aria-pressed="false" aria-describedby="stereo-strength-reason" disabled>強</button>
            </div>
        </div>
        <p class="context-reason" id="stereo-strength-reason">立体視を選ぶと「強」が使えます</p>
    </section>
    <div class="btn-group type-btns" id="crystal-type-group" role="group" aria-label="結晶の種類">
        <button data-type="CsCl">CsCl型</button>
        <button data-type="NaCl" class="active">NaCl型</button>
        <button data-type="ZnS">ZnS型</button>
        <button data-type="FCC">FCC</button>
    </div>

    <div id="fcc-controls" hidden>
        <div class="btn-group" id="fcc-mode" role="group" aria-label="観察方法"><button data-value="normal" class="active">原子</button><button data-value="void">間隙</button><button data-value="compare" aria-describedby="fcc-mode-reason">比較表示</button></div>
        <p class="context-reason" id="fcc-mode-reason" hidden>比較は立体視を解除すると使えます</p>
        <div id="fcc-atom-controls">
            <div id="fcc-palette-controls">
                <div class="label-text">色分け</div>
                <div class="btn-group" id="fcc-palette" role="group" aria-label="原子の色分け"><button data-value="sites" class="active">頂点・面心</button><button data-value="abc">ABC層</button></div>
            </div>
            <div class="label-text" id="fcc-grid-label">格子数・切り出し</div>
            <div id="fcc-grid-row" class="control-grid">
        <div class="mini-btn-group" id="grid-mode-group" role="group" aria-label="格子数">
            <button data-mode="0" class="active" title="単位格子（1個）" aria-label="単位格子（1個）">
                <svg viewBox="1 1 22 22" width="28" height="28" stroke="currentColor" fill="none" stroke-width="1.5" stroke-linejoin="round">
                    <polygon points="12,5 19,8.5 12,12 5,8.5"></polygon>
                    <polygon points="5,8.5 12,12 12,19 5,15.5"></polygon>
                    <polygon points="12,12 19,8.5 19,15.5 12,19"></polygon>
                </svg>
            </button>
            <button data-mode="1" title="田の字（4個）" aria-label="田の字（4個）">
                <svg viewBox="1 1 22 22" width="28" height="28" stroke="currentColor" fill="none" stroke-width="1.2" stroke-linejoin="round">
                    <polygon points="12,5 21,9.5 12,14 3,9.5"></polygon>
                    <line x1="7.5" y1="7.25" x2="16.5" y2="11.75"></line>
                    <line x1="16.5" y1="7.25" x2="7.5" y2="11.75"></line>
                    <polygon points="3,9.5 12,14 12,19 3,14.5"></polygon>
                    <line x1="7.5" y1="11.75" x2="7.5" y2="16.75"></line>
                    <polygon points="12,14 21,9.5 21,14.5 12,19"></polygon>
                    <line x1="16.5" y1="11.75" x2="16.5" y2="16.75"></line>
                </svg>
            </button>
            <button data-mode="2" title="8個" aria-label="8個">
                <svg viewBox="1 1 22 22" width="28" height="28" stroke="currentColor" fill="none" stroke-width="1" stroke-linejoin="round">
                    <polygon points="12,2 22,7 12,12 2,7"></polygon>
                    <line x1="7" y1="4.5" x2="17" y2="9.5"></line>
                    <line x1="17" y1="4.5" x2="7" y2="9.5"></line>
                    <polygon points="2,7 12,12 12,22 2,17"></polygon>
                    <line x1="7" y1="9.5" x2="7" y2="19.5"></line>
                    <line x1="2" y1="12" x2="12" y2="17"></line>
                    <polygon points="12,12 22,7 22,17 12,22"></polygon>
                    <line x1="17" y1="9.5" x2="17" y2="19.5"></line>
                    <line x1="12" y1="17" x2="22" y2="12"></line>
                </svg>
            </button>
        </div>
        <button id="toggle-clipping" class="toggle-btn active" data-prop="isClipping">格子切り出し</button>
            </div>
            <div class="label-text">不透明度</div>
            <div class="opacity-row"><label class="opacity-label" for="fcc-atom-opacity">原子 <output id="fcc-atom-value">85%</output></label><input id="fcc-atom-opacity" aria-label="原子の不透明度" type="range" min="0" max="1" step="0.01" value="0.85"></div>
            <div class="btn-group" style="margin-top:8px"><button id="fcc-restore" aria-describedby="fcc-restore-reason">全原子を再表示</button></div>
            <p class="context-reason" id="fcc-restore-reason">非表示の原子はありません</p>
        </div>
        <div id="fcc-void-controls" hidden>
            <div class="label-text">間隙の種類</div>
            <div class="btn-group" id="fcc-kind" role="group" aria-label="間隙の種類"><button data-value="oct">八面体</button><button data-value="tet">四面体</button><button data-value="both" class="active">両方</button></div>
            <div class="label-text">間隙の表示</div>
            <div class="btn-group" id="fcc-display" role="group" aria-label="間隙の表示"><button data-value="void">間隙</button><button data-value="sphere">間隙球</button><button data-value="both" class="active">両方</button></div>
            <div class="label-text">不透明度</div>
            <div class="opacity-row" id="fcc-void-opacity-row"><label class="opacity-label" for="fcc-void-opacity">間隙 <output id="fcc-void-value">70%</output></label><input id="fcc-void-opacity" aria-label="間隙の不透明度" type="range" min="0" max="1" step="0.01" value="0.7"></div>
            <div class="opacity-row" id="fcc-sphere-opacity-row"><label class="opacity-label" for="fcc-sphere-opacity">間隙球 <output id="fcc-sphere-value">60%</output></label><input id="fcc-sphere-opacity" aria-label="間隙球の不透明度" type="range" min="0" max="1" step="0.01" value="0.6"></div>
        </div>
    </div>
    <div class="control-group" id="legacy-ratio" style="margin-bottom: 10px;">
        <div class="label-text">
            <span>半径比：陽/陰</span>
            <div>
                <span id="ratio-display" style="font-weight:bold; margin-right:4px;">0.414</span>
                <span id="stability-info">○ 安定</span>
            </div>
        </div>
        <div style="display: flex; align-items: center; gap: 4px;">
            <button id="toggle-ratio-pin" class="toggle-btn" title="半径比を固定" aria-label="半径比を固定">固定</button>
            <input type="range" id="ratio-slider" aria-label="陽イオンと陰イオンの半径比" min="0" max="1" step="0.001" style="flex: 1;">
        </div>
    </div>

    <div class="control-grid" id="legacy-actions">
        <button id="toggle-size-mode" class="toggle-btn active" data-prop="isFixedBoxMode">格子サイズ固定</button>
        <span id="legacy-clipping-slot" hidden></span>

        <button id="toggle-avoid-overlap" class="toggle-btn active" data-prop="isAvoidOverlap">重なり回避</button>
        <button id="toggle-diagonal" aria-describedby="ion-section-reason" class="toggle-btn" data-prop="isDiagonalMode">対角断面</button>


        <p class="context-reason full-row" id="ion-section-reason">格子切り出しをオンにすると断面操作が使えます</p>
    </div>

    <p class="context-reason" id="ion-opacity-reason" hidden>補助線を消すと不透明度を変更できます</p>
    <div class="control-group" id="legacy-opacity" style="margin-bottom: 12px;">
        <div class="label-text" style="margin-bottom: 4px;"><span>不透明度</span></div>
        <div class="opacity-row" id="opacity-p-row">
            <span class="opacity-label">陽 <span id="opacity-p-display">70%</span></span>
            <input type="range" id="opacity-p-slider" aria-label="陽イオンの不透明度" aria-describedby="ion-opacity-reason" min="0" max="1.0" step="0.01" value="0.70" style="flex: 1;">
        </div>
        <div class="opacity-row" id="opacity-m-row">
            <span class="opacity-label">陰 <span id="opacity-m-display">60%</span></span>
            <input type="range" id="opacity-m-slider" aria-label="陰イオンの不透明度" aria-describedby="ion-opacity-reason" min="0" max="1.0" step="0.01" value="0.60" style="flex: 1;">
        </div>
        <div class="btn-group" style="margin-top:8px"><button id="ion-restore" aria-describedby="ion-restore-reason">全イオンを再表示</button></div>
        <p class="context-reason" id="ion-restore-reason">非表示のイオンはありません</p>
    </div>

    <div id="legacy-grid-controls" style="margin-bottom: 12px;">
        <div id="legacy-grid-home"></div>

    </div>

    <div class="control-grid" id="common-actions">
        <button id="btn-reset-pos" class="toggle-btn" aria-label="模型の位置・向き・ズームをリセット" title="模型の位置・向き・ズームをリセット">位置を戻す</button>
        <button id="toggle-quality" class="toggle-btn" data-prop="isLowQuality">軽量モード</button>
    </div>

    <div class="btn-group bg-btns" id="bg-color-group" role="group" aria-label="背景色" style="margin-bottom: 0;">
        <button data-color="white" class="active">白</button>
        <button data-color="gray">灰</button>
        <button data-color="black">黒</button>
    </div>
</div>

<div id="fcc-divider" hidden></div>
<div id="fcc-portrait" hidden>比較は横画面推奨</div>
<div id="fcc-loading" role="status" hidden>間隙モデルを準備中…</div>

<script>
    window.onload = () => { if (typeof THREE !== 'undefined') initSim(); };

    const CONFIG = {
        crystals: {
            NaCl: { min: 0.414, max: 2.415 },
            CsCl: { min: 0.732, max: 1.366 },
            ZnS:  { min: 0.225, max: 4.444 }
        },
        colors: {
            cation: 0xFFB6C1,
            anion: 0xADD8E6,
            grid: 0x007aff,
            auxYellow: 0xffff00,
            auxGreen:  0x00ff00,
            auxPink:   0xff00cc,
            auxPurple: 0xbf00ff,
            auxCyan:   0x00ffff
        },
        snapPoints: [0.225, 0.414, 0.732, 1.0, 1.366, 2.415, 4.444],
        ratioMap: {
            min: 0.10, max: 3.5, mid: 0.792,
            get k() { return Math.log((this.mid - this.min) / (this.max - this.min)) / Math.log(0.5); },
            toRatio(t) { return (this.max - this.min) * Math.pow(t, this.k) + this.min; },
            toSlider(v) { return Math.pow(Math.max(0, Math.min(1, (v - this.min) / (this.max - this.min))), 1 / this.k); }
        }
    };

    const STATE = {
        type: 'NaCl',
        stereoMode: 'off',
        stereoStrong: false,
        ratio: 0.414,
        rMinus: 1.0,
        opacityP: 0.70,
        opacityM: 0.60,
        savedOpacityP: 0.70,
        savedOpacityM: 0.60,
        isOpacityForced: false,
        isClipping: true,
        isCapsVisible: true,
        isFixedBoxMode: true,
        isAvoidOverlap: true,
        isLowQuality: false,
        isPanelPinned: !(matchMedia('(pointer: coarse)').matches && Math.min(screen.width, screen.height) < 600),
        isRatioPinned: false,
        isDiagonalMode: false,
        isOrthographic: false,
        gridMode: 0,
        auxLinesState: 0,
        savedFixedA: 0,
        viewOffsetX: 0,
        viewOffsetY: 0,
        currentCenter: new THREE.Vector3()
    };

    function disposeHierarchy(node) {
        if (!node) return;
        if (node.children) {
            for (let i = node.children.length - 1; i >= 0; i--) {
                disposeHierarchy(node.children[i]);
            }
        }
        if (node.geometry) node.geometry.dispose();
        if (node.material) {
            if (Array.isArray(node.material)) {
                node.material.forEach(mat => mat.dispose());
            } else {
                node.material.dispose();
            }
        }
        if (node.parent) node.parent.remove(node);
    }

    function initSim() {
        let scene, activeCamera, cameraP, cameraO, renderer, controls, fcc, ionLight;
        let atomsGroup, gridFrame, diagonalLinesGroup, surfaceLinesGroup, boxEdgesGroup;
        let isRightDown = false, isTouchPan = false;
        let lastPanX = 0, lastPanY = 0;
        let currentPlanes = [];
        const hiddenIons = new Set();
        let ionSites = [], recentHiddenIon = null;
        const modelTouchIds = new Set();
        let suppressModelTouches = false, modelMouseDown = false;

        let rotationGlide = false;
        let views, stereoWasOrtho = false;

        const DOM = {
            panel: document.getElementById('ui-panel'),
            togglePanelBtn: document.getElementById('toggle-panel-btn'),
            ratioDisplay: document.getElementById('ratio-display'),
            stabilityInfo: document.getElementById('stability-info'),
            opacityPDisplay: document.getElementById('opacity-p-display'),
            opacityMDisplay: document.getElementById('opacity-m-display'),
            ratioSlider: document.getElementById('ratio-slider'),
            ratioPinBtn: document.getElementById('toggle-ratio-pin'),
            opacityPSlider: document.getElementById('opacity-p-slider'),
            opacityMSlider: document.getElementById('opacity-m-slider'),
            opacityPRow: document.getElementById('opacity-p-row'),
            opacityMRow: document.getElementById('opacity-m-row'),
            clippingBtn: document.getElementById('toggle-clipping'),
            diagonalBtn: document.getElementById('toggle-diagonal'),
            btnPersp: document.getElementById('btn-persp'),
            btnOrtho: document.getElementById('btn-ortho')
        };

        const calculateRealA = (type, rP, rM, avoidOverlap) => {
            const standardA = (type === 'NaCl') ? 2 * (rP + rM) :
                              (type === 'CsCl') ? 2 * (rP + rM) / Math.sqrt(3) :
                              4 * (rP + rM) / Math.sqrt(3);
            if (!avoidOverlap) return standardA;
            if (type === 'NaCl') return Math.max(2 * (rP + rM), 2 * Math.sqrt(2) * rM, 2 * Math.sqrt(2) * rP);
            if (type === 'CsCl') return Math.max(2 * (rP + rM) / Math.sqrt(3), 2 * rM, 2 * rP);
            return Math.max(4 * (rP + rM) / Math.sqrt(3), 2 * Math.sqrt(2) * rM, 2 * Math.sqrt(2) * rP);
        };

        const initThreeJS = () => {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0xf8f9fa);

            const aspect = window.innerWidth / window.innerHeight;
            cameraP = new THREE.PerspectiveCamera(40, aspect, 0.1, 1000);
            cameraP.position.set(10, 8, 12);

            const dist = 10;
            const vH = 2 * dist * Math.tan(THREE.MathUtils.degToRad(40 / 2));
            cameraO = new THREE.OrthographicCamera(-vH * aspect / 2, vH * aspect / 2, vH / 2, -vH / 2, 0.1, 1000);
            cameraO.position.set(10, 8, 12);

            activeCamera = cameraP;

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.localClippingEnabled = true;
            document.body.appendChild(renderer.domElement);

            controls = new THREE.TrackballControls(activeCamera, renderer.domElement);
            controls.noPan = true;
            controls.staticMoving = true;
            controls.rotateSpeed = 3;
            controls.keys = [];
            controls.dynamicDampingFactor = .15;
            const nativeRotate = controls.rotateCamera;
            controls.rotateCamera = () => {
                controls.staticMoving = !rotationGlide;
                nativeRotate.call(controls);
                controls.staticMoving = true;
            };
            renderer.domElement.addEventListener('pointerdown', () => { rotationGlide = false; }, true);
            renderer.domElement.addEventListener('pointermove', e => {
                if (modelMouseDown && e.pointerType !== 'touch' && controls.enabled && !suppressModelTouches && e.buttons === 1 && (e.movementX || e.movementY)) { rotationGlide = true; }
            }, true);
            renderer.domElement.addEventListener('touchmove', e => {
                if (e.touches.length === 1 && !suppressModelTouches) { rotationGlide = true; }
            }, {capture:true,passive:true});
            renderer.domElement.addEventListener('wheel', () => { rotationGlide = false; }, {capture:true,passive:true});
            // r128 Trackball uses the reciprocal orthographic pinch factor.
            // Correct only its touch-pinch path; native wheel zoom stays intact.
            const nativeZoomCamera = controls.zoomCamera;
            controls.zoomCamera = () => {
                const camera = controls.object, beforeZoom = camera.zoom;
                nativeZoomCamera.call(controls);
                if (!suppressModelTouches && modelTouchIds.size > 1 && camera.isOrthographicCamera) {
                    camera.zoom = beforeZoom * beforeZoom / camera.zoom;
                    camera.updateProjectionMatrix();
                }
            };
            const canvas = renderer.domElement;
            const blockTouch = e => { e.preventDefault(); e.stopImmediatePropagation(); };
            canvas.addEventListener('touchstart', e => {
                const liveIds = new Set(Array.from(e.touches, touch => touch.identifier));
                for (const id of modelTouchIds) if (!liveIds.has(id)) modelTouchIds.delete(id);
                if (!modelTouchIds.size) suppressModelTouches = false;
                for (const touch of Array.from(e.changedTouches)) modelTouchIds.add(touch.identifier);
                if (!controls.enabled) suppressModelTouches = true;
                if (suppressModelTouches) blockTouch(e);
            }, { capture: true, passive: false });
            canvas.addEventListener('touchmove', e => {
                if (suppressModelTouches) blockTouch(e);
            }, { capture: true, passive: false });
            const finishTouch = e => {
                const suppressed = suppressModelTouches;
                for (const touch of Array.from(e.changedTouches)) modelTouchIds.delete(touch.identifier);
                if (!modelTouchIds.size) suppressModelTouches = false;
                if (suppressed && e.target === canvas) blockTouch(e);
            };
            document.addEventListener('touchend', finishTouch, { capture: true, passive: false });
            document.addEventListener('touchcancel', finishTouch, { capture: true, passive: false });
            canvas.addEventListener('pointerdown', e => {
                if (!controls.enabled) { e.preventDefault(); e.stopImmediatePropagation(); return; }
                if (e.pointerType === 'mouse' || e.pointerType === 'pen') modelMouseDown = true;
            }, true);
            document.addEventListener('pointermove', e => {
                if (modelMouseDown && e.pointerType !== 'touch' && e.buttons === 0) stopCameraMotion();
            }, true);
            window.addEventListener('pointerup', e => {
                if (e.pointerType !== 'touch') modelMouseDown = false;
            }, true);

            scene.add(new THREE.AmbientLight(0xffffff, 0.8));
            ionLight = new THREE.DirectionalLight(0xffffff, 0.4);
            scene.add(ionLight, ionLight.target);

            atomsGroup = new THREE.Group(); scene.add(atomsGroup);
            diagonalLinesGroup = new THREE.Group(); scene.add(diagonalLinesGroup);
            surfaceLinesGroup = new THREE.Group(); scene.add(surfaceLinesGroup);
            boxEdgesGroup = new THREE.Group(); scene.add(boxEdgesGroup);
        };

        const stopCameraMotion = () => {
            rotationGlide = false;
            controls.enabled = true;
            // Flush queued deltas once, then clear Trackball's active input state
            // without moving the current pose back to constructor defaults.
            controls.update();
            controls.target0.copy(controls.target);
            controls.position0.copy(activeCamera.position);
            controls.up0.copy(activeCamera.up);
            controls.zoom0 = activeCamera.zoom;
            controls.reset();
            if (modelTouchIds.size) suppressModelTouches = true;
            modelMouseDown = false;
            isRightDown = false;
            isTouchPan = false;
            if (fcc) fcc.viewChanged();
        };

        const syncCameras = (toOrtho) => {
            stopCameraMotion();
            const aspect = window.innerWidth / window.innerHeight;
            if (toOrtho) {
                const dist = cameraP.position.distanceTo(controls.target);
                const vH = 2 * dist * Math.tan(THREE.MathUtils.degToRad(cameraP.fov / 2));
                cameraO.left = -vH * aspect / 2;
                cameraO.right = vH * aspect / 2;
                cameraO.top = vH / 2;
                cameraO.bottom = -vH / 2;
                cameraO.position.copy(cameraP.position);
                cameraO.up.copy(cameraP.up);
                cameraO.quaternion.copy(cameraP.quaternion);
                cameraO.zoom = 1;
                cameraO.updateProjectionMatrix();
                activeCamera = cameraO;
            } else {
                const vH_current = (cameraO.top - cameraO.bottom) / cameraO.zoom;
                const dist_new = vH_current / (2 * Math.tan(THREE.MathUtils.degToRad(cameraP.fov / 2)));
                const dir = new THREE.Vector3().subVectors(cameraO.position, controls.target).normalize();
                if(dir.lengthSq() < 0.0001) dir.set(0, 0, 1);
                cameraP.position.copy(controls.target).add(dir.multiplyScalar(dist_new));
                cameraP.up.copy(cameraO.up);
                cameraP.quaternion.copy(cameraO.quaternion);
                cameraP.updateProjectionMatrix();
                activeCamera = cameraP;
            }
            controls.object = activeCamera;
            controls.update();
        };

        const updateOpacityUI = () => {
            DOM.opacityPSlider.value = STATE.opacityP;
            DOM.opacityMSlider.value = STATE.opacityM;
            DOM.opacityPDisplay.innerText = Math.round(STATE.opacityP * 100) + '%';
            DOM.opacityMDisplay.innerText = Math.round(STATE.opacityM * 100) + '%';

            if (STATE.isOpacityForced) {
                DOM.opacityPSlider.disabled = true;
                DOM.opacityMSlider.disabled = true;
                DOM.opacityPRow.style.opacity = '0.5';
                DOM.opacityMRow.style.opacity = '0.5';
            } else {
                DOM.opacityPSlider.disabled = false;
                DOM.opacityMSlider.disabled = false;
                DOM.opacityPRow.style.opacity = '1';
                DOM.opacityMRow.style.opacity = '1';
            }
        };

        const checkOpacityForceState = () => {
            const shouldForce = STATE.auxLinesState > 0;
            if (shouldForce && !STATE.isOpacityForced) {
                STATE.savedOpacityP = STATE.opacityP;
                STATE.savedOpacityM = STATE.opacityM;
                STATE.opacityP = 1.0;
                STATE.opacityM = 1.0;
                STATE.isOpacityForced = true;
                updateOpacityUI();
            } else if (!shouldForce && STATE.isOpacityForced) {
                STATE.opacityP = STATE.savedOpacityP;
                STATE.opacityM = STATE.savedOpacityM;
                STATE.isOpacityForced = false;
                updateOpacityUI();
            }
        };

        function syncPanelUI() {
            const stereo = STATE.stereoMode !== 'off';
            document.getElementById('toggle-pin').classList.toggle('active',STATE.isPanelPinned);
            const strong = document.getElementById('btn-stereo-strong');
            strong.disabled = !stereo;
            strong.classList.toggle('active',STATE.stereoStrong);
            strong.setAttribute('aria-pressed',String(STATE.stereoStrong));
            document.getElementById('stereo-strength-reason').hidden = stereo;
            describeControl(strong,'stereo-strength-reason',!stereo);
            const hidden = [...hiddenIons].some(id=>id.startsWith(STATE.type+':'));
            const restore = document.getElementById('ion-restore');
            restore.disabled = !hidden;
            const reason = document.getElementById('ion-restore-reason');
            reason.textContent = !hidden ? '非表示のイオンはありません' : '不透明度0%のイオンは戻しても見えません';
            reason.hidden = hidden && !(STATE.opacityP===0 || STATE.opacityM===0);
            describeControl(restore,'ion-restore-reason',!reason.hidden);
            DOM.diagonalBtn.disabled = !STATE.isClipping;
            const sectionReason = document.getElementById('ion-section-reason');
            sectionReason.hidden = !DOM.diagonalBtn.disabled;
            describeControl(DOM.diagonalBtn,'ion-section-reason',DOM.diagonalBtn.disabled);
            const opacityReason = document.getElementById('ion-opacity-reason');
            opacityReason.hidden = STATE.type==='FCC' || !STATE.isOpacityForced;
            describeControl(DOM.opacityPSlider,'ion-opacity-reason',!opacityReason.hidden);
            describeControl(DOM.opacityMSlider,'ion-opacity-reason',!opacityReason.hidden);
            document.querySelectorAll('#ui-panel button[data-type],#ui-panel button[data-mode],#ui-panel button[data-color],#ui-panel button[data-prop],#toggle-pin,#toggle-ratio-pin,#btn-persp,#btn-ortho,#btn-stereo').forEach(button=>button.setAttribute('aria-pressed',String(button.classList.contains('active'))));
        }

        const updateScene = () => {
            syncPanelUI();
            const isFCC = STATE.type === 'FCC';
            document.getElementById('fcc-controls').hidden = !isFCC;
            document.getElementById('legacy-ratio').hidden = isFCC;
            document.getElementById('legacy-opacity').hidden = isFCC;
            ['toggle-size-mode','toggle-avoid-overlap','toggle-diagonal'].forEach(id => document.getElementById(id).hidden = isFCC);
            controls.noPan = true;
            document.getElementById('legacy-actions').hidden = isFCC;
            document.getElementById('legacy-grid-controls').hidden = isFCC;
            if (isFCC) { controls.enabled = true; fcc.update(); return; }
            fcc.deactivate();
            ionSites = [];
            while(atomsGroup.children.length > 0){ disposeHierarchy(atomsGroup.children[0]); }
            while(diagonalLinesGroup.children.length > 0){ disposeHierarchy(diagonalLinesGroup.children[0]); }
            while(surfaceLinesGroup.children.length > 0){ disposeHierarchy(surfaceLinesGroup.children[0]); }
            while(boxEdgesGroup.children.length > 0){ disposeHierarchy(boxEdgesGroup.children[0]); }
            if (gridFrame) { disposeHierarchy(gridFrame); gridFrame = null; }

            const a = calculateRealA(STATE.type, STATE.ratio, STATE.rMinus, STATE.isAvoidOverlap);
            let draw_a = a, draw_rP = STATE.ratio, draw_rM = STATE.rMinus;

            if (STATE.isFixedBoxMode) {
                const scale = STATE.savedFixedA / a;
                draw_a = STATE.savedFixedA;
                draw_rP *= scale;
                draw_rM *= scale;
            }

            const multX = STATE.gridMode > 0 ? 2 : 1;
            const multY = STATE.gridMode === 2 ? 2 : 1;
            const multZ = STATE.gridMode > 0 ? 2 : 1;

            const newCenter = new THREE.Vector3(draw_a * multX / 2, draw_a * multY / 2, draw_a * multZ / 2);
            if (STATE.currentCenter.lengthSq() === 0) {
                STATE.currentCenter.copy(newCenter);
                controls.target.copy(newCenter);
            } else {
                const shift = newCenter.clone().sub(STATE.currentCenter);
                if(shift.lengthSq()>1e-10)fcc.viewChanged();
                controls.target.copy(newCenter);
                activeCamera.position.add(shift);
                STATE.currentCenter.copy(newCenter);
            }

            let planes = [];
            let diagonalPlane = null;

            if (STATE.isClipping) {
                planes = [
                    new THREE.Plane(new THREE.Vector3( 1, 0, 0), 0), new THREE.Plane(new THREE.Vector3(-1, 0, 0), draw_a * multX),
                    new THREE.Plane(new THREE.Vector3( 0, 1, 0), 0), new THREE.Plane(new THREE.Vector3( 0,-1, 0), draw_a * multY),
                    new THREE.Plane(new THREE.Vector3( 0, 0, 1), 0), new THREE.Plane(new THREE.Vector3( 0, 0,-1), draw_a * multZ)
                ];
                if (STATE.isDiagonalMode) {
                    const normal = new THREE.Vector3(-1, 0, 1).normalize();
                    diagonalPlane = new THREE.Plane(normal, 0);
                    planes.push(diagonalPlane);
                }
            }
            currentPlanes = planes;

            const segments = STATE.isLowQuality ? 16 : 32;
            const baseSphereGeo = new THREE.SphereGeometry(1, segments, segments);
            const matP = new THREE.MeshPhongMaterial({ color: CONFIG.colors.cation, clippingPlanes: planes, transparent: true, opacity: STATE.opacityP, shininess: 40 });
            const matM = new THREE.MeshPhongMaterial({ color: CONFIG.colors.anion, clippingPlanes: planes, transparent: true, opacity: STATE.opacityM, shininess: 40 });

            const addIon = (radius, isCation, px, py, pz) => {
                const currentOpacity = isCation ? STATE.opacityP : STATE.opacityM;
                const id = STATE.type + ':' + [px,py,pz].map(v => Math.round(v / draw_a * 4)).join(',');
                ionSites.push({ id, position:[px,py,pz], radius, opacity:currentOpacity });
                if (currentOpacity <= 0) return;

                const mesh = new THREE.Mesh(baseSphereGeo, isCation ? matP : matM);
                mesh.scale.set(radius, radius, radius);
                mesh.position.set(px, py, pz);
                mesh.userData.ionSiteId = id;
                mesh.visible = !hiddenIons.has(id);
                atomsGroup.add(mesh);

                if (STATE.isClipping && STATE.isCapsVisible) {
                    planes.forEach(plane => {
                        const dist = plane.distanceToPoint(mesh.position);
                        if (Math.abs(dist) < radius) {
                            const capR = Math.sqrt(radius * radius - dist * dist);
                            const capMat = new THREE.MeshBasicMaterial({
                                color: isCation ? CONFIG.colors.cation : CONFIG.colors.anion,
                                side: THREE.DoubleSide, clippingPlanes: planes,
                                transparent: true, opacity: Math.min(currentOpacity + 0.2, 1.0),
                                polygonOffset: true, polygonOffsetFactor: -1
                            });
                            const cap = new THREE.Mesh(new THREE.CircleGeometry(capR, segments), capMat);
                            const pos = mesh.position.clone().add(plane.normal.clone().multiplyScalar(-dist + 0.001));
                            cap.position.copy(pos);
                            cap.userData.ionSiteId = id;
                            cap.visible = !hiddenIons.has(id);
                            cap.lookAt(pos.clone().add(plane.normal));
                            if (STATE.isDiagonalMode && plane === diagonalPlane) cap.userData.isDiagonalPlane = true;
                            atomsGroup.add(cap);
                        }
                    });
                }
            };

            if (STATE.type === 'NaCl') {
                for(let x=0; x<=multX; x+=0.5)
                for(let y=0; y<=multY; y+=0.5)
                for(let z=0; z<=multZ; z+=0.5) {
                    if ((x+y+z)%1 === 0) addIon(draw_rM, false, x*draw_a, y*draw_a, z*draw_a);
                    else addIon(draw_rP, true, x*draw_a, y*draw_a, z*draw_a);
                }
            } else if (STATE.type === 'CsCl') {
                for(let x=0; x<=multX; x++)
                for(let y=0; y<=multY; y++)
                for(let z=0; z<=multZ; z++) {
                    addIon(draw_rM, false, x*draw_a, y*draw_a, z*draw_a);
                }
                for(let x=0; x<multX; x++)
                for(let y=0; y<multY; y++)
                for(let z=0; z<multZ; z++) {
                    addIon(draw_rP, true, x*draw_a + draw_a/2, y*draw_a + draw_a/2, z*draw_a + draw_a/2);
                }
            } else {
                for(let x=0; x<=multX; x+=0.5)
                for(let y=0; y<=multY; y+=0.5)
                for(let z=0; z<=multZ; z+=0.5) {
                    if((x+y+z)%1===0 && (x%1===0||y%1===0||z%1===0))
                        addIon(draw_rM, false, x*draw_a, y*draw_a, z*draw_a);
                }
                for(let cx=0; cx<multX; cx++)
                for(let cy=0; cy<multY; cy++)
                for(let cz=0; cz<multZ; cz++) {
                    [[1/4,1/4,1/4], [3/4,3/4,1/4], [1/4,3/4,3/4], [3/4,1/4,3/4]].forEach(p =>
                        addIon(draw_rP, true, (cx+p[0])*draw_a, (cy+p[1])*draw_a, (cz+p[2])*draw_a)
                    );
                }
            }

            const createLineObj = (p1, p2, colorHex, opacity, depthTest, usePlanes) => {
                const matParams = {
                    color: colorHex,
                    transparent: true,
                    opacity: opacity,
                    depthTest: depthTest,
                    side: THREE.DoubleSide,
                    polygonOffset: true,
                    polygonOffsetFactor: -2,
                    polygonOffsetUnits: -2
                };
                if (usePlanes) matParams.clippingPlanes = planes;

                const mat = new THREE.MeshBasicMaterial(matParams);
                const dist = p1.distanceTo(p2);
                const geo = new THREE.CylinderGeometry(draw_a * 0.0015, draw_a * 0.0015, dist, 6, 1, false);
                const mesh = new THREE.Mesh(geo, mat);
                mesh.position.copy(p1).lerp(p2, 0.5);

                if (dist > 0.0001) {
                    const dir = new THREE.Vector3().subVectors(p2, p1).normalize();
                    mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir);
                }
                return mesh;
            };

            if (STATE.auxLinesState > 0) {
                const colorDiagonal1 = STATE.auxLinesState === 1 ? CONFIG.colors.auxYellow : CONFIG.colors.auxPink;
                const colorDiagonal2 = STATE.auxLinesState === 1 ? CONFIG.colors.auxGreen : CONFIG.colors.auxPurple;

                const faces = [
                    { n: [0,0,1],  c: [draw_a/2, draw_a/2, draw_a], pts: [ [0,0,draw_a, draw_a,draw_a,draw_a], [0,draw_a,draw_a, draw_a,0,draw_a] ] },
                    { n: [0,0,-1], c: [draw_a/2, draw_a/2, 0],      pts: [ [0,0,0, draw_a,draw_a,0], [0,draw_a,0, draw_a,0,0] ] },
                    { n: [1,0,0],  c: [draw_a, draw_a/2, draw_a/2], pts: [ [draw_a,0,0, draw_a,draw_a,draw_a], [draw_a,draw_a,0, draw_a,0,draw_a] ] },
                    { n: [-1,0,0], c: [0, draw_a/2, draw_a/2],      pts: [ [0,0,0, 0,draw_a,draw_a], [0,draw_a,0, 0,0,draw_a] ] },
                    { n: [0,1,0],  c: [draw_a/2, draw_a, draw_a/2], pts: [ [0,draw_a,0, draw_a,draw_a,draw_a], [0,draw_a,draw_a, draw_a,draw_a,0] ] },
                    { n: [0,-1,0], c: [draw_a/2, 0, draw_a/2],      pts: [ [0,0,0, draw_a,0,draw_a], [0,0,draw_a, draw_a,0,0] ] }
                ];

                const edges = [
                    { pts: [0,0,0, draw_a,0,0], normals: [[0,-1,0], [0,0,-1]] },
                    { pts: [0,0,0, 0,0,draw_a], normals: [[0,-1,0], [-1,0,0]] },
                    { pts: [draw_a,0,0, draw_a,0,draw_a], normals: [[0,-1,0], [1,0,0]] },
                    { pts: [0,0,draw_a, draw_a,0,draw_a], normals: [[0,-1,0], [0,0,1]] },
                    { pts: [0,draw_a,0, draw_a,draw_a,0], normals: [[0,1,0], [0,0,-1]] },
                    { pts: [0,draw_a,0, 0,draw_a,draw_a], normals: [[0,1,0], [-1,0,0]] },
                    { pts: [draw_a,draw_a,0, draw_a,draw_a,draw_a], normals: [[0,1,0], [1,0,0]] },
                    { pts: [0,draw_a,draw_a, draw_a,draw_a,draw_a], normals: [[0,1,0], [0,0,1]] },
                    { pts: [0,0,0, 0,draw_a,0], normals: [[-1,0,0], [0,0,-1]] },
                    { pts: [draw_a,0,0, draw_a,draw_a,0], normals: [[1,0,0], [0,0,-1]] },
                    { pts: [0,0,draw_a, 0,draw_a,draw_a], normals: [[-1,0,0], [0,0,1]] },
                    { pts: [draw_a,0,draw_a, draw_a,draw_a,draw_a], normals: [[1,0,0], [0,0,1]] }
                ];

                const ox = 0;
                const oy = 0;
                const oz = 0;

                faces.forEach(f => {
                    const faceGroup = new THREE.Group();
                    faceGroup.userData.normal = new THREE.Vector3(...f.n);
                    faceGroup.userData.center = new THREE.Vector3(...f.c).add(new THREE.Vector3(ox, oy, oz));

                    f.pts.forEach((pts, idx) => {
                        const p1 = new THREE.Vector3(pts[0]+ox, pts[1]+oy, pts[2]+oz);
                        const p2 = new THREE.Vector3(pts[3]+ox, pts[4]+oy, pts[5]+oz);
                        const color = (idx % 2 === 0) ? colorDiagonal1 : colorDiagonal2;
                        const line = createLineObj(p1, p2, color, 1.0, true, true);
                        line.renderOrder = 997;
                        faceGroup.add(line);
                    });
                    surfaceLinesGroup.add(faceGroup);
                });

                edges.forEach(e => {
                    const p1 = new THREE.Vector3(e.pts[0]+ox, e.pts[1]+oy, e.pts[2]+oz);
                    const p2 = new THREE.Vector3(e.pts[3]+ox, e.pts[4]+oy, e.pts[5]+oz);
                    const line = createLineObj(p1, p2, CONFIG.colors.auxCyan, 1.0, true, true);
                    line.renderOrder = 996;
                    line.userData.normals = e.normals.map(n => new THREE.Vector3(...n));
                    line.userData.center = new THREE.Vector3().copy(p1).lerp(p2, 0.5);
                    boxEdgesGroup.add(line);
                });

                if (STATE.isDiagonalMode) {
                    const d_pts = [
                        [new THREE.Vector3(0, 0, 0), new THREE.Vector3(draw_a, 0, draw_a)],
                        [new THREE.Vector3(draw_a, 0, draw_a), new THREE.Vector3(draw_a, draw_a, draw_a)],
                        [new THREE.Vector3(draw_a, draw_a, draw_a), new THREE.Vector3(0, draw_a, 0)],
                        [new THREE.Vector3(0, draw_a, 0), new THREE.Vector3(0, 0, 0)]
                    ];
                    d_pts.forEach(pair => {
                        const line = createLineObj(pair[0], pair[1], CONFIG.colors.auxCyan, 1.0, true, false);
                        line.renderOrder = 998;
                        diagonalLinesGroup.add(line);
                    });

                    if (STATE.type === 'ZnS') {
                        const midX = draw_a / 2;
                        const lineV = createLineObj(new THREE.Vector3(midX+ox, 0, midX+oz), new THREE.Vector3(midX+ox, draw_a, midX+oz), CONFIG.colors.auxCyan, 1.0, true, false);
                        const lineH = createLineObj(new THREE.Vector3(ox, midX, oz), new THREE.Vector3(draw_a+ox, midX, draw_a+oz), CONFIG.colors.auxCyan, 1.0, true, false);
                        lineV.renderOrder = 999; lineH.renderOrder = 999;
                        diagonalLinesGroup.add(lineV); diagonalLinesGroup.add(lineH);

                        const lineShort1 = createLineObj(new THREE.Vector3(draw_a+ox, midX, draw_a+oz), new THREE.Vector3(midX+ox, 0, midX+oz), colorDiagonal1, 1.0, true, false);
                        const lineShort2 = createLineObj(new THREE.Vector3(ox, midX, oz), new THREE.Vector3(midX+ox, 0, midX+oz), colorDiagonal2, 1.0, true, false);
                        lineShort1.renderOrder = 999; lineShort2.renderOrder = 999;
                        diagonalLinesGroup.add(lineShort1); diagonalLinesGroup.add(lineShort2);
                    }

                    const lineDiag1 = createLineObj(new THREE.Vector3(ox, 0, oz), new THREE.Vector3(draw_a+ox, draw_a, draw_a+oz), colorDiagonal1, 1.0, true, false);
                    const lineDiag2 = createLineObj(new THREE.Vector3(ox, draw_a, oz), new THREE.Vector3(draw_a+ox, 0, draw_a+oz), colorDiagonal2, 1.0, true, false);
                    lineDiag1.renderOrder = 999; lineDiag2.renderOrder = 999;
                    diagonalLinesGroup.add(lineDiag1); diagonalLinesGroup.add(lineDiag2);
                }
            }

            if (STATE.isDiagonalMode) {
                const clickPlaneGeo = new THREE.PlaneGeometry(Math.sqrt(2) * draw_a, draw_a);
                const clickPlaneMat = new THREE.MeshBasicMaterial({ visible: false, depthTest: false });
                const clickPanel = new THREE.Mesh(clickPlaneGeo, clickPlaneMat);
                clickPanel.position.set(draw_a/2, draw_a/2, draw_a/2);
                clickPanel.lookAt(new THREE.Vector3(draw_a/2, draw_a/2, draw_a/2).add(new THREE.Vector3(-1, 0, 1)));
                clickPanel.userData.isDiagonalPlane = true;
                diagonalLinesGroup.add(clickPanel);
            }

            gridFrame = new THREE.LineSegments(
                new THREE.EdgesGeometry(new THREE.BoxGeometry(draw_a * multX, draw_a * multY, draw_a * multZ)),
                new THREE.LineBasicMaterial({ color: CONFIG.colors.grid, transparent: true, opacity: 0.3, clippingPlanes: planes })
            );
            gridFrame.position.set(draw_a * multX / 2, draw_a * multY / 2, draw_a * multZ / 2);
            scene.add(gridFrame);

            DOM.ratioDisplay.innerText = STATE.ratio.toFixed(3);
            const lim = CONFIG.crystals[STATE.type];
            if (STATE.ratio < lim.min - 0.0001) {
                DOM.stabilityInfo.innerText = "× 不安定(陰接触)"; DOM.stabilityInfo.className = "unstable";
            } else if (STATE.ratio > lim.max + 0.0001) {
                DOM.stabilityInfo.innerText = "× 不安定(陽接触)"; DOM.stabilityInfo.className = "unstable";
            } else {
                DOM.stabilityInfo.innerText = "○ 安定"; DOM.stabilityInfo.className = "stable";
            }
        };

        const handleIonTap = (count,point) => {
            if(STATE.type === 'FCC') return;
            activeCamera.updateMatrixWorld();
            const ray = new THREE.Raycaster();
            const picked = views.pick(activeCamera,point.x,point.y);
            ray.setFromCamera(picked.ndc,picked.camera);
            const planes = currentPlanes.map(p => ({ n:p.normal.toArray().map(v=>-v), d:p.constant }));
            const hits = ionSites.flatMap(site => {
                const distance = FCCGeometry.raySphereDistance(ray.ray.origin.toArray(),ray.ray.direction.toArray(),site.position,site.radius,planes);
                return distance === null ? [] : [{ id:site.id, distance, opacity:site.opacity }];
            });
            const visible = hits.filter(hit => hit.opacity > 0 && !hiddenIons.has(hit.id));
            if(count === 1){
                if(!visible.length)return;
                STATE.auxLinesState = (STATE.auxLinesState + 1) % 3;
                checkOpacityForceState();updateScene();return;
            }
            const recent = recentHiddenIon && Date.now()-recentHiddenIon.time < 5000 && Math.hypot(point.x-recentHiddenIon.x,point.y-recentHiddenIon.y)<12 ? recentHiddenIon.id : null;
            const id = FCCGeometry.pickAtom(count===2?visible:hits,hiddenIons,count===2?'hide':'restore',recent);
            if(!id){
                if(count===2&&!hits.some(hit=>hit.opacity>0||hiddenIons.has(hit.id))&&!STATE.isPanelPinned&&DOM.panel.classList.contains('hidden')){
                    DOM.panel.classList.remove('hidden');DOM.togglePanelBtn.innerText='✕ 設定を閉じる';
                }
                return;
            }
            if(count===2){hiddenIons.add(id);recentHiddenIon={id,time:Date.now(),x:point.x,y:point.y};}
            else{hiddenIons.delete(id);recentHiddenIon=null;}
            updateScene();
        };

        const registerEvents = () => {
            const setPanelVisible = (visible) => {
                visible ? DOM.panel.classList.remove('hidden') : DOM.panel.classList.add('hidden');
                DOM.togglePanelBtn.innerHTML = visible ? '✕ 設定を閉じる' : '≡ 設定を表示';
            };

            const setStereoMode = (next, exitProjection) => {
                stopCameraMotion();
                const old = STATE.stereoMode;
                if (old === 'off') {
                    stereoWasOrtho = STATE.isOrthographic;
                    if (stereoWasOrtho) { STATE.isOrthographic = false; syncCameras(false); }
                }
                STATE.stereoMode = next;
                fcc.setStereo(next !== 'off');
                if (next === 'off') {
                    const useOrtho = exitProjection === undefined ? stereoWasOrtho : exitProjection;
                    if (STATE.isOrthographic !== useOrtho) { STATE.isOrthographic = useOrtho; syncCameras(useOrtho); }
                }
                DOM.btnPersp.classList.toggle('active', !STATE.isOrthographic);
                DOM.btnOrtho.classList.toggle('active', STATE.isOrthographic);
                const label = next === 'off' ? '立体視' : next === 'cross' ? '交差法' : '平行法';
                const button = document.getElementById('btn-stereo');
                button.textContent = label; button.title = '立体視：' + (next === 'off' ? '通常表示' : label);
                button.setAttribute('aria-label',button.title); button.setAttribute('aria-pressed',String(next !== 'off'));
                button.classList.toggle('active', next !== 'off');
                button.parentElement.classList.toggle('active', next !== 'off');
                syncPanelUI();
            };

            const chooseProjection = useOrtho => {
                if (views.stereo()) { setStereoMode('off',useOrtho); return; }
                if (STATE.isOrthographic === useOrtho) return;
                STATE.isOrthographic = useOrtho;
                DOM.btnPersp.classList.toggle('active',!useOrtho);
                DOM.btnOrtho.classList.toggle('active',useOrtho);
                syncCameras(useOrtho);
                syncPanelUI();
            };
            DOM.btnPersp.onclick = () => chooseProjection(false);
            DOM.btnOrtho.onclick = () => chooseProjection(true);
            document.getElementById('btn-stereo').onclick = () => {
                const old = STATE.stereoMode;
                setStereoMode(old === 'off' ? 'cross' : old === 'cross' ? 'parallel' : 'off');
            };

            document.getElementById('btn-stereo-strong').onclick = () => {
                STATE.stereoStrong = !STATE.stereoStrong;
                fcc.viewChanged();
                syncPanelUI();
            };

            document.getElementById('crystal-type-group').addEventListener('click', e => {
                if(e.target.tagName !== 'BUTTON') return;
                const newType = e.target.dataset.type;
                const oldType = STATE.type;
                const cellSize = type => type === 'FCC' ? 3 : STATE.isFixedBoxMode ? STATE.savedFixedA : calculateRealA(type,STATE.ratio,STATE.rMinus,STATE.isAvoidOverlap);
                const oldSize = cellSize(oldType);
                stopCameraMotion();
                STATE.type = newType;
                if (newType !== 'FCC' && !STATE.isRatioPinned) {
                    STATE.ratio = CONFIG.crystals[newType].min;
                    DOM.ratioSlider.value = CONFIG.ratioMap.toSlider(STATE.ratio);
                }
                document.querySelectorAll('.type-btns button').forEach(b => b.classList.toggle('active', b === e.target));
                updateScene();
                if (oldType !== newType && ['NaCl','ZnS','FCC'].includes(oldType) && ['NaCl','ZnS','FCC'].includes(newType)) {
                    const factor = cellSize(newType) / oldSize;
                    if (activeCamera.isOrthographicCamera) { activeCamera.zoom /= factor; activeCamera.updateProjectionMatrix(); }
                    else activeCamera.position.sub(controls.target).multiplyScalar(factor).add(controls.target);
                    controls.update();
                }
            });

            // SVGボタン切り替えイベント
            const gridModeBtns = document.querySelectorAll('#grid-mode-group button');
            gridModeBtns.forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const button = e.currentTarget;
                    STATE.gridMode = parseInt(button.dataset.mode);
                    gridModeBtns.forEach(b => b.classList.remove('active'));
                    button.classList.add('active');
                    updateScene();
                });
            });

            document.querySelectorAll('button[data-prop]').forEach(btn => {
                btn.addEventListener('click', e => {
                    const prop = e.target.dataset.prop;

                    if (prop === 'isDiagonalMode') {
                        if (!STATE.isClipping) return;
                        STATE.isDiagonalMode = !STATE.isDiagonalMode;
                        e.target.classList.toggle('active', STATE.isDiagonalMode);

                        checkOpacityForceState();

                    } else {
                        STATE[prop] = !STATE[prop];
                        e.target.classList.toggle('active', STATE[prop]);
                    }

                    if (prop === 'isFixedBoxMode' && STATE.isFixedBoxMode) {
                        STATE.savedFixedA = calculateRealA(STATE.type, STATE.ratio, STATE.rMinus, STATE.isAvoidOverlap);
                    }
                    if (prop === 'isClipping') {
                        DOM.diagonalBtn.classList.toggle('disabled', !STATE.isClipping);
                        if (!STATE.isClipping && STATE.isDiagonalMode) {
                            STATE.isDiagonalMode = false;
                            DOM.diagonalBtn.classList.remove('active');
                            checkOpacityForceState();
                        }
                    }
                    updateScene();
                });
            });

            DOM.ratioPinBtn.onclick = (e) => {
                STATE.isRatioPinned = !STATE.isRatioPinned;
                e.target.classList.toggle('active', STATE.isRatioPinned);
                syncPanelUI();
            };

            document.getElementById('toggle-pin').onclick = e => {
                STATE.isPanelPinned = !STATE.isPanelPinned;
                e.target.classList.toggle('active', STATE.isPanelPinned);
                syncPanelUI();
            };

            DOM.togglePanelBtn.onclick = () => setPanelVisible(DOM.panel.classList.contains('hidden'));

            const fullScreenButton = document.getElementById('toggle-fullscreen');
            fullScreenButton.hidden = !document.fullscreenEnabled || typeof document.documentElement.requestFullscreen !== 'function';
            fullScreenButton.onclick = async () => {
                try { await (document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen()); }
                catch { fullScreenButton.hidden = true; }
            };


            document.getElementById('btn-reset-pos').onclick = () => {
                if (STATE.type === 'FCC') { fcc.reset(); return; }
                stopCameraMotion();
                STATE.viewOffsetX = 0; STATE.viewOffsetY = 0; views.resetLayout(); applyViewOffset();
                cameraP.up.set(0, 1, 0);
                cameraO.up.set(0, 1, 0);
                cameraP.zoom = 1;
                cameraP.position.set(10, 8, 12);
                controls.target.copy(STATE.currentCenter);
                cameraP.lookAt(STATE.currentCenter);

                if(STATE.isOrthographic) {
                    syncCameras(true);
                } else {
                    cameraP.lookAt(STATE.currentCenter);
                    controls.update();
                }
            };

            document.getElementById('bg-color-group').addEventListener('click', e => {
                if(e.target.tagName !== 'BUTTON') return;
                const c = e.target.dataset.color;
                scene.background = new THREE.Color(c === 'white' ? 0xf8f9fa : c === 'gray' ? 0x666666 : 0x050505);
                document.querySelectorAll('.bg-btns button').forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                syncPanelUI();
            });

            const handleOpacity = (e, type) => {
                let v = parseFloat(e.target.value);
                if(Math.abs(v - 0.75) < 0.02) v = 0.75;
                e.target.value = v;

                if (!STATE.isOpacityForced) {
                    STATE[`opacity${type}`] = v;
                    STATE[`savedOpacity${type}`] = v;
                    updateOpacityUI();
                    updateScene();
                }
            };
            DOM.opacityPSlider.oninput = e => handleOpacity(e, 'P');
            DOM.opacityMSlider.oninput = e => handleOpacity(e, 'M');

            document.getElementById('ion-restore').onclick = () => {
                for(const id of hiddenIons)if(id.startsWith(STATE.type+':'))hiddenIons.delete(id);
                recentHiddenIon=null;updateScene();
            };

            DOM.ratioSlider.oninput = (e) => {
                let t = parseFloat(e.target.value);
                let v = CONFIG.ratioMap.toRatio(t);
                for(let p of CONFIG.snapPoints) {
                    if(Math.abs(v - p) < 0.035) { v = p; break; }
                }
                e.target.value = CONFIG.ratioMap.toSlider(v);
                STATE.ratio = v;
                updateScene();
            };

            const applyViewOffset = () => {
                const w = window.innerWidth, h = window.innerHeight;
                const aspect = w / h;

                cameraP.aspect = aspect;
                cameraP.setViewOffset(w, h, STATE.viewOffsetX, STATE.viewOffsetY, w, h);
                cameraP.updateProjectionMatrix();

                if (cameraO) {
                    const vH = cameraO.top - cameraO.bottom;
                    cameraO.left = -vH * aspect / 2;
                    cameraO.right = vH * aspect / 2;
                    cameraO.setViewOffset(w, h, STATE.viewOffsetX, STATE.viewOffsetY, w, h);
                    cameraO.updateProjectionMatrix();
                }
            };

            window.addEventListener('resize', () => {
                renderer.setSize(window.innerWidth, window.innerHeight);
                controls.handleResize();
                applyViewOffset();
            });

            controls.addEventListener('start', () => {
                if (!STATE.isPanelPinned && !DOM.panel.classList.contains('hidden')) setPanelVisible(false);
            });

            const canvas = renderer.domElement;

            canvas.addEventListener('contextmenu', e => e.preventDefault());

            canvas.addEventListener('pointerdown', e => {
                if (!e.isPrimary) return;
                if(e.pointerType === 'mouse' && e.button === 2){ isRightDown = true; lastPanX = e.clientX; lastPanY = e.clientY; if(!STATE.isPanelPinned) setPanelVisible(false); return; }

            });

            window.addEventListener('pointermove', e => {
                if(isRightDown){
                    fcc.viewChanged();
                    STATE.viewOffsetX -= (e.clientX - lastPanX); STATE.viewOffsetY -= (e.clientY - lastPanY);
                    lastPanX = e.clientX; lastPanY = e.clientY; applyViewOffset();
                }
            });

            canvas.addEventListener('touchstart', e => {
                if(e.touches.length > 1)fcc.viewChanged();
                isTouchPan = e.touches.length === 2;
                if(isTouchPan){
                    isTouchPan = true;
                    lastPanX = (e.touches[0].clientX + e.touches[1].clientX) / 2;
                    lastPanY = (e.touches[0].clientY + e.touches[1].clientY) / 2;
                }
            }, {passive: false});

            window.addEventListener('touchmove', e => {
                if(isTouchPan && e.touches.length === 2){
                    fcc.viewChanged();
                    const cx = (e.touches[0].clientX + e.touches[1].clientX) / 2, cy = (e.touches[0].clientY + e.touches[1].clientY) / 2;
                    STATE.viewOffsetX -= (cx - lastPanX); STATE.viewOffsetY -= (cy - lastPanY);
                    lastPanX = cx; lastPanY = cy; applyViewOffset();
                }
            }, {passive: true});
            const cancelPan = () => { isRightDown = false; isTouchPan = false; stopCameraMotion(); };
            window.addEventListener('pointerup', e => { if(e.button === 2) isRightDown = false; });
            window.addEventListener('pointercancel', cancelPan);
            window.addEventListener('blur', cancelPan);
            window.addEventListener('touchend', () => isTouchPan = false);
            window.addEventListener('touchcancel', cancelPan);
        };

        let updateViewCube = () => {};
        const animate = () => {
            updateViewCube();
            requestAnimationFrame(animate);
            if (STATE.type === 'FCC') { controls.update(); fcc.render(activeCamera, scene.background); return; }

            if (STATE.auxLinesState > 0 && surfaceLinesGroup) {
                let camDir = new THREE.Vector3();
                activeCamera.getWorldDirection(camDir);
                camDir.negate();

                surfaceLinesGroup.children.forEach(faceGroup => {
                    const normal = faceGroup.userData.normal;
                    if (STATE.isOrthographic) {
                        faceGroup.visible = (normal.dot(camDir) > 0);
                    } else {
                        const center = faceGroup.userData.center;
                        const camToCenter = new THREE.Vector3().subVectors(activeCamera.position, center);
                        faceGroup.visible = (camToCenter.dot(normal) > 0);
                    }
                });
            }

            if (STATE.auxLinesState > 0 && boxEdgesGroup) {
                let camDir = new THREE.Vector3();
                activeCamera.getWorldDirection(camDir);
                camDir.negate();

                boxEdgesGroup.children.forEach(edgeMesh => {
                    const normals = edgeMesh.userData.normals;
                    let isVisible = false;

                    for (const normal of normals) {
                        if (STATE.isOrthographic) {
                            if (normal.dot(camDir) > 0) { isVisible = true; break; }
                        } else {
                            const edgeCenter = edgeMesh.userData.center;
                            const camToCenter = new THREE.Vector3().subVectors(activeCamera.position, edgeCenter);
                            if (camToCenter.dot(normal) > 0) { isVisible = true; break; }
                        }
                    }
                    edgeMesh.visible = isVisible;
                });
            }

            if (STATE.isDiagonalMode && diagonalLinesGroup) {
                const a = calculateRealA(STATE.type, STATE.ratio, STATE.rMinus, STATE.isAvoidOverlap);
                const draw_a = STATE.isFixedBoxMode ? STATE.savedFixedA : a;
                const multX = STATE.gridMode > 0 ? 2 : 1;
                const multY = STATE.gridMode === 2 ? 2 : 1;
                const multZ = STATE.gridMode > 0 ? 2 : 1;

                const center = new THREE.Vector3(draw_a * multX / 2, draw_a * multY / 2, draw_a * multZ / 2);

                const normal = new THREE.Vector3(1, 0, -1).normalize();
                const camToCenter = new THREE.Vector3().subVectors(activeCamera.position, center);

                const dot = camToCenter.dot(normal);
                diagonalLinesGroup.visible = (dot > 0);
            }

            controls.update();
            placeScreenLight(ionLight,activeCamera,controls.target);
            views.render(renderer, scene, activeCamera);
        };

        initThreeJS();
        views = createModelViews({ THREE, state: STATE, getTarget: () => controls.target });
        fcc = createFCCView({ THREE, renderer, controls, state: STATE, getCamera: () => activeCamera, cameras: [cameraP,cameraO], views, stopMotion: stopCameraMotion, onIonTap: handleIonTap, onViewChange: () => { recentHiddenIon=null; } });
        updateViewCube = createViewCube({THREE,getCamera:()=>activeCamera,controls,state:STATE,stopMotion:stopCameraMotion,onChange:()=>fcc.viewChanged()});
        registerEvents();

        STATE.savedFixedA = calculateRealA(STATE.type, STATE.ratio, STATE.rMinus, STATE.isAvoidOverlap);
        DOM.ratioSlider.value = CONFIG.ratioMap.toSlider(STATE.ratio);

        document.querySelectorAll('.type-btns button').forEach(b => b.classList.toggle('active', b.dataset.type === STATE.type));
        updateScene();
        fcc.reset();
        animate();
    }
</script>
</body>
</html>
